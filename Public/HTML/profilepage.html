<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/img/misc/favicon.png" />
  <link rel="stylesheet" href="../CSS/index.css" />
  <link rel="stylesheet" href="../CSS/userCard.css" />
  <link rel="stylesheet" href="../CSS/profilepage.css" />
  <link rel="stylesheet" href="../CSS/backButton.css">
  <title>Profil - Pluggskap</title>
</head>

<body>
  <header id="header"></header>
  <main>
    <section class="user-card"></section>
    <button id="change-user-info">Ändra</button>
    <div id="result-box">
      <div id="text-box">
        <div id="results-list"></div>
        <div class="chart-container">
          <canvas id="result-chart"></canvas>
        </div>
      </div>
    </div>
    <div id="user-info-box">
      <section id="user-info">
        <form id="change-user-form">
          <button id="close-user-box">&#10007</button>
          <h2>Ändra användaruppgifter</h2>
          <input type="text" name="username" id="username" placeholder="Ändra användarnamn" />
          <input type="password" id="password" placeholder="Ändra lösenord" />
          <button id="change-user-button">Spara</button>
          <span id="user-updated">Användare uppdaterad!</span>
        </form>
        <h2>Radera användare</h2>
        <button id="delete-user">Radera</button>
      </section>
    </div>
    <section id="confirm-delete-user-box">
      <button id="close-delete-box">&#10007</button>
      <h3>Är du säker på att du vill radera användare?</h2>
        <button id="confirm-delete-user">Radera</button>
    </section>
  </main>
  <footer></footer>
  <script src="../js/header.js"></script>
  <script src="../js/userCard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <script src="../js/resultBar.js"></script>
  <script src="../js/profilepage.js"></script>
  <script src="../js/backButton.js"></script>
</body>

</html>
