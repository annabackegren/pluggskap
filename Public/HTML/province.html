<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/img/misc/favicon.png" />
    <link rel="stylesheet" href="../CSS/index.css" />
    <link rel="stylesheet" href="../CSS/province.css" />

    <title>Landskapsnamn - Pluggskap</title>
  </head>

  <body>
    <div id="header"></div>
    <main>
      <div id="user-wrapper">User-Wrapper</div>

      <div class="province-wrapper">
        <div class="province-header">
          <img src="" alt="Vapensköld" />
          <h1>Landskapsnamn</h1>
        </div>

        <section class="province-grid">
          <button class="card-button" data-type="animal">
            <article class="card">
              <figure><img src="" alt="Landskapsdjur" /></figure>
              <div class="card-content">
                <h2>Djur:</h2>
                <p>Djurets namn</p>
              </div>
            </article>
          </button>
          <button class="card-button" data-type="plant">
            <article class="card">
              <figure><img src="" alt="Landskapsväxt" /></figure>
              <div class="card-content">
                <h2>Växt:</h2>
                <p>Växtens namn</p>
              </div>
            </article>
          </button>
          <button class="card-button" data-type="bird">
            <article class="card">
              <figure><img src="" alt="Landskapsfågel" /></figure>
              <div class="card-content">
                <h2>Fågel:</h2>
                <p>Fågelns namn</p>
              </div>
            </article>
          </button>
          <button class="card-button" data-type="food">
            <article class="card">
              <figure><img src="" alt="Landskapsmat" /></figure>
              <div class="card-content">
                <h2>Maträtt:</h2>
                <p>Matens namn</p>
              </div>
            </article>
          </button>
        </section>
      </div>

      <div id="popup" class="popup">
        <div class="popup-content"></div>
      </div>
    </main>
  </body>
  <script src="../js/index.js"></script>
  <script src="../js/province.js"></script>
</html>
