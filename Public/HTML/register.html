<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pluggskap</title>
    <link rel="stylesheet" href="../CSS/index.css" />
    <link rel="stylesheet" href="../CSS/register.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/pluggskap/public/css/images/globe_no_arms.png"
    />
  </head>

  <body>
    <div id="header"></div>
    <main>
      <form id="userinfo" action="">
        <div class="passwordgroup">
          <span id="username-exists">Användarnamnet är upptaget</span>
          <input
            id="username"
            name="username"
            placeholder="Användarnamn"
            type="text"
            required
          />
        </div>
        <div class="passwordgroup">
          <span id="passworderror"
            >Lösenordet måste innehålla mer än 3 tecken</span
          >
          <input
            id="password"
            name="password"
            placeholder="Lösenord"
            type="password"
            required
          />
        </div>
        <div class="passwordgroup">
          <span id="cfpassworderror">Lösenordet matchar inte</span>
          <input
            id="confirmpassword"
            name="confirmpassword"
            placeholder="Bekräfta lösenord"
            type="password"
            required
          />
        </div>
        <div class="radiobtns">
          <div>
            <input
              id="elevbtn"
              class="usertype"
              name="usertype"
              type="radio"
              value="elev"
            />
            <label for="elevbtn">Elev</label>
          </div>
          <div>
            <input
              id="lararebtn"
              class="usertype"
              name="usertype"
              type="radio"
              value="larare"
            />
            <label for="lararebtn">Lärare</label>
          </div>
        </div>
        <div id="gdpr">
          <input id="gdprcheck" name="gdprcheck" type="checkbox" />
          <label for="gdprcheck"
            >Jag godkänner att Pluggskap behandlar mina personuppgifter för att
            tillhandahålla kontot, utbildningen och relaterade tjänster enligt
            <a
              target="_blank"
              rel="noopener noreferrer"
              href="../html/gdpr.html"
              >integritetspolicyn.</a
            ></label
          >
        </div>
        <input id="submitbtn" type="submit" value="Skapa användare" />
      </form>
      <div>
        <p id="usercreated">Användare skapad!</p>
      </div>
      <a href="login.html"><button id="loginbtn">LOGGA IN</button></a>
    </main>
    <footer></footer>
  </body>
  <script src="../js/header.js"></script>
  <script src="../js/register.js"></script>
</html>
