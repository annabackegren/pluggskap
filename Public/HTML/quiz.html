<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/img/misc/favicon.png" />
    <link rel="stylesheet" href="../CSS/index.css" />
    <link rel="stylesheet" href="../CSS/userCard.css" />
    <link rel="stylesheet" href="../CSS/quiz.css" />
    <link rel="stylesheet" href="../CSS/profilepage.css" />
    <link rel="stylesheet" href="../CSS/backButton.css" />

    <title>Quiz - Pluggskap</title>
  </head>

  <body>
    <header id="header"></header>
    <main>
      <section class="user-card"></section>

      <div class="quiz-wrapper">
        <div class="quiz-header quiz-header--province">
          <h1>Landskapsnamn</h1>
        </div>
        <div id="question-wrapper">
          <div class="counter-container">
            <p id="question-counter"></p>
            <div class="chart-container">
              <canvas id="question-counter-bar"></canvas>
            </div>
          </div>
          <p id="question-text"></p>
          <img src="" alt="" id="question-img" />
          <img
            src="../assets/img/misc/party-monster.png"
            alt=""
            id="quiz-end-img"
          />
          <ul id="question-answers"></ul>
          <p id="quiz-feedback"></p>
        </div>
        <button id="next-button" class="button">Nästa fråga >></button>
        <div id="quiz-end-buttons">
          <button id="restart-button" class="button">Spela igen</button>
          <button id="back-province-button" class="button">
            Tillbaka till landskapet
          </button>
        </div>
      </div>
    </main>
    <script src="../js/header.js"></script>
    <script src="../js/userCard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="../js/counterBar.js"></script>
    <script src="../js/quiz.js"></script>
    <script src="../js/backButton.js"></script>
  </body>
</html>
