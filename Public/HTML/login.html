<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logga in - Pluggskap</title>
    <link rel="stylesheet" href="../CSS/index.css" />
    <link rel="stylesheet" href="../CSS/login.css" />
    <link rel="icon" type="image/png" href="../assets/img/misc/favicon.png" />
  </head>

  <body>
    <div id="header"></div>
    <main>
      <form id="loginform">
        <input
          id="username"
          name="username"
          placeholder="Användarnamn"
          type="text"
          required
        />
        <input
          id="password"
          name="password"
          placeholder="Lösenord"
          type="password"
          required
        />
        <span id="loginerror">Användarnamn eller lösenord är fel</span>
        <input id="loginbtn" type="submit" value="LOGGA IN" />
      </form>
    </main>
    <footer></footer>
  </body>
  <script src="../js/header.js"></script>
  <script src="../js/login.js"></script>
</html>
